<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>FIFA World Cup 2026 Calendar</title>
  </head>

  <body class="body">
    <div class="container">
      <h1 class="header">Football (soccer) World Cup 2026 calendar</h1>
      <div class="box">
        <h2 class="heading">Mac / iPhone</h2>
        <a
          class="logo-picture1"
          href="webcal://calendar.google.com/calendar/ical/ce1203e9973cf5d1d894159a5f6a783fe9daee46103d5328c02f6eea6f33a092%40group.calendar.google.com/public/basic.ics"
        >
          <img
            src="../img/apple-calendar.svg"
            width="100"
            height="100"
            alt="ical subscribe button"
        /></a>
      </div>

      <div class="box">
        <h2 class="heading">Android</h2>
        <a
          class="logo-picture2"
          href="https://calendar.google.com/calendar/r?cid=ce1203e9973cf5d1d894159a5f6a783fe9daee46103d5328c02f6eea6f33a092%40group.calendar.google.com"
          ><img
            src="../img/google-calendar.svg"
            width="100"
            height="100"
            alt="android subscribe button"
        /></a>
      </div>
    </div>
